<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para minha Bruna ❤️</title>
<link rel="icon" type="image/png" href="B.png">

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7f8 0%,
                    #ffeef1 45%,
                    #ffdce3 100%
                );

            color: #721629;

            user-select: none;

            -webkit-user-select: none;

            -webkit-tap-highlight-color: transparent;

        }



        /* =========================================================
           FUNDO
        ========================================================= */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;

        }


        .glow {

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            filter: blur(70px);

        }


        .glow.one {

            top: -180px;
            left: -100px;

        }


        .glow.two {

            bottom: -180px;
            right: -100px;

        }



        /* =========================================================
           CORAÇÕES DO FUNDO
        ========================================================= */

        .floating-heart {

            position: absolute;

            color:
                rgba(
                    210,
                    35,
                    70,
                    0.10
                );

            font-size: 25px;

            animation:
                floatHeart
                var(--duration)
                ease-in-out
                infinite;

            animation-delay:
                var(--delay);

        }


        .heart-1 {
            left: 8%;
            top: 15%;
            --duration: 5s;
            --delay: 0s;
            font-size: 28px;
        }


        .heart-2 {
            right: 12%;
            top: 22%;
            --duration: 6s;
            --delay: 1s;
            font-size: 18px;
        }


        .heart-3 {
            left: 16%;
            bottom: 20%;
            --duration: 7s;
            --delay: 2s;
            font-size: 22px;
        }


        .heart-4 {
            right: 10%;
            bottom: 15%;
            --duration: 5.5s;
            --delay: 3s;
            font-size: 30px;
        }


        @keyframes floatHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(-5deg);
            }

            50% {
                transform:
                    translateY(-20px)
                    rotate(5deg);
            }

            100% {
                transform:
                    translateY(0)
                    rotate(-5deg);
            }

        }



        /* =========================================================
           ÁREA PRINCIPAL
        ========================================================= */

        .game {

            position: relative;

            z-index: 2;

            min-height: 100vh;
            min-height: 100dvh;

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                30px
                20px;

        }



        /* =========================================================
           TÍTULO
        ========================================================= */

        .title {

            font-size:
                clamp(
                    28px,
                    7vw,
                    48px
                );

            font-weight: 800;

            color: #971a37;

            margin-bottom: 10px;

            letter-spacing: -1px;

        }


        .subtitle {

            max-width: 480px;

            font-size:
                clamp(
                    15px,
                    4vw,
                    18px
                );

            line-height: 1.5;

            color: #86404f;

            margin-bottom: 25px;

        }



        /* =========================================================
           CONTADOR
        ========================================================= */

        .counter {

            font-size:
                clamp(
                    13px,
                    3vw,
                    15px
                );

            color: #a65b68;

            margin-bottom: 12px;

            letter-spacing: 1px;

        }



        /* =========================================================
           CORAÇÃO — ÁREA
        ========================================================= */

        .heart-wrapper {

            position: relative;

            width:
                min(
                    78vw,
                    340px
                );

            height:
                min(
                    78vw,
                    340px
                );

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 18px;

        }



        /* =========================================================
           CÍRCULO DE BRILHO ATRÁS
        ========================================================= */

        .heart-glow {

            position: absolute;

            width: 70%;
            height: 70%;

            border-radius: 50%;

            background:
                rgba(
                    220,
                    20,
                    60,
                    0.16
                );

            filter: blur(30px);

            opacity: 0.7;

            transition:
                transform 0.4s ease,
                opacity 0.4s ease;

        }



        /* =========================================================
           O CORAÇÃO
        ========================================================= */
.heart-button {

    position: relative;

    width: 80%;
    height: 80%;

    border: none;

    background: transparent;

    background-color: transparent;

    padding: 0;

    margin: 0;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    touch-action: manipulation;

    outline: none;

    box-shadow: none;

    -webkit-appearance: none;

    appearance: none;

    -webkit-tap-highlight-color: transparent;

    -webkit-focus-ring-color: transparent;

}


.heart-button:focus,
.heart-button:focus-visible,
.heart-button:active {

    outline: none !important;

    background: transparent !important;

    background-color: transparent !important;

    box-shadow: none !important;

    -webkit-tap-highlight-color: transparent !important;

}
       
.heart-svg {

    width: 100%;
    height: 100%;

    overflow: visible;

    transform-origin: center;
/*
    filter:
        drop-shadow(
            0
            12px
            15px
            rgba(
                140,
                15,
                40,
                0.22
            )
        );
*/

}


        /* =========================================================
           CORAÇÃO BASE
        ========================================================= */

        .heart-base {

            fill: #c9153b;

        }



        /* =========================================================
           ÁREA DE PREENCHIMENTO
        ========================================================= */

        .heart-fill {

            fill:
                url(#heartGradient);

            clip-path:
                inset(
                    100%
                    0
                    0
                    0
                );

            transition:
                clip-path 0.45s
                cubic-bezier(
                    0.25,
                    0.8,
                    0.25,
                    1
                );

        }



        /* =========================================================
           BRILHO DO CORAÇÃO
        ========================================================= */

        .heart-highlight {

            fill:
                rgba(
                    255,
                    255,
                    255,
                    0.28
                );

        }



        /* =========================================================
           CONTORNO
        ========================================================= */

        .heart-outline {

            fill: none;

            stroke:
                rgba(
                    255,
                    255,
                    255,
                    0.30
                );

            stroke-width: 2;

        }



        /* =========================================================
           NÚMERO
        ========================================================= */

        .percentage {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            color: white;

            font-size:
                clamp(
                    32px,
                    10vw,
                    58px
                );

            font-weight: 900;

            text-shadow:
                0 3px 7px
                rgba(
                    90,
                    0,
                    20,
                    0.35
                );

            pointer-events: none;

            z-index: 10;

        }



        /* =========================================================
           PULSO DO CORAÇÃO
        ========================================================= */

        .heart-button.pulse .heart-svg {

            animation:
                heartPulse
                0.48s
                cubic-bezier(
                    0.36,
                    0,
                    0.66,
                    -0.56
                );

        }


        @keyframes heartPulse {

            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.16);
            }

            45% {
                transform: scale(0.93);
            }

            65% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }

        }



        /* =========================================================
           BRILHO AO CLICAR
        ========================================================= */

        .heart-button.pulse
        + .percentage {

            animation:
                numberPop
                0.45s
                ease;

        }


        @keyframes numberPop {

            0% {
                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1);
            }

            40% {
                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.18);
            }

            100% {
                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1);
            }

        }



        /* =========================================================
           INSTRUÇÃO
        ========================================================= */

        .instruction {

            min-height: 25px;

            font-size:
                clamp(
                    14px,
                    4vw,
                    17px
                );

            color: #8c4554;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;

        }



        /* =========================================================
           BARRA DE PROGRESSO
        ========================================================= */

        .progress {

            width:
                min(
                    70vw,
                    260px
                );

            height: 6px;

            background:
                rgba(
                    150,
                    30,
                    55,
                    0.12
                );

            border-radius: 999px;

            margin-top: 18px;

            overflow: hidden;

        }


        .progress-fill {

            height: 100%;

            width: 0%;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #d71943,
                    #ff7188
                );

            transition:
                width 0.45s
                ease;

        }



        /* =========================================================
           MENSAGEM FINAL
        ========================================================= */

        .final-message {

            position: absolute;

            bottom: 7%;

            width: 90%;

            max-width: 500px;

            opacity: 0;

            transform:
                translateY(20px);

            pointer-events: none;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        .final-message.show {

            animation:
                finalMessage
                1s
                ease
                forwards;

            pointer-events: auto;

        }


        .final-message h2 {

            font-size:
                clamp(
                    25px,
                    7vw,
                    38px
                );

            color: #a71838;

            margin-bottom: 0;

        }



        /* =========================================================
           BOTÃO RECOMEÇAR
        ========================================================= */

        #restartButton {

            margin-top: 15px;

            padding:
                10px
                22px;

            border: none;

            border-radius: 999px;

            background: #c9153b;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            display: block;

        }


        #restartButton:hover {

            transform: scale(1.05);

        }


        #restartButton:active {

            transform: scale(0.95);

        }



        @keyframes finalMessage {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }



        /* =========================================================
           ANIMAÇÃO FINAL
        ========================================================= */

        .finished .heart-svg {

            animation:
                finalHeart
                1.1s
                ease-in-out
                infinite;

        }


        .finished .heart-glow {

            animation:
                finalGlow
                1.1s
                ease-in-out
                infinite;

        }


        @keyframes finalHeart {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.10);

            }

        }


        @keyframes finalGlow {

            0%,
            100% {

                transform:
                    scale(0.9);

                opacity:
                    0.45;

            }

            50% {

                transform:
                    scale(1.15);

                opacity:
                    0.9;

            }

        }



        /* =========================================================
           PARTÍCULAS
        ========================================================= */

        .particle {

            position: fixed;

            left: 0;
            top: 0;

            z-index: 50;

            pointer-events: none;

            font-size: 20px;

            color: #d71943;

            animation:
                particleMove
                0.9s
                ease-out
                forwards;

        }


        @keyframes particleMove {

            0% {

                opacity: 1;

                transform:
                    translate(
                        0,
                        0
                    )
                    scale(0.7)
                    rotate(0deg);

            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        var(--move-x),
                        var(--move-y)
                    )
                    scale(1.1)
                    rotate(
                        var(--rotate)
                    );

            }

        }



        /* =========================================================
           FLASH QUANDO CLICA
        ========================================================= */

        .click-flash {

            position: fixed;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.8
                );

            pointer-events: none;

            z-index: 40;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(0);

            animation:
                flash
                0.5s
                ease-out
                forwards;

        }


        @keyframes flash {

            0% {

                opacity: 0.8;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0);

            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(8);

            }

        }



        /* =========================================================
           PC
        ========================================================= */

        @media (min-width: 700px) {

            .game {

                max-width: 700px;
                margin: 0 auto;
            }


            .heart-wrapper {

                width: 350px;
                height: 350px;

            }

        }



        /* =========================================================
           CELULARES PEQUENOS
        ========================================================= */

        @media (max-height: 700px) {

            .game {

                padding-top: 15px;
                padding-bottom: 15px;

            }


            .title {

                font-size: 25px;

                margin-bottom: 5px;

            }


            .subtitle {

                margin-bottom: 8px;

                font-size: 18px;

            }


            .counter {

                margin-bottom: 4px;

            }


            .heart-wrapper {

                width: 220px;
                height: 220px;

                margin-bottom: 5px;

            }


            .progress {

                margin-top: 8px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         FUNDO
    ========================================================== -->

    <div class="background">

        <div class="glow one"></div>

        <div class="glow two"></div>


        <span class="floating-heart heart-1">
            ♥
        </span>

        <span class="floating-heart heart-2">
            ♥
        </span>

        <span class="floating-heart heart-3">
            ♥
        </span>

        <span class="floating-heart heart-4">
            ♥
        </span>

    </div>



    <!-- =========================================================
         JOGO
    ========================================================== -->

    <main class="game" id="game">


        <h1 class="title">
            OPERAÇÃO: RECARGA
        </h1>


        <p class="subtitle">
            Ajude este coração!
        </p>


        <div
            class="counter"
            id="counter"
        >
            0% carregado
        </div>



        <!-- =====================================================
             CORAÇÃO
        ====================================================== -->

        <div
            class="heart-wrapper"
            id="heartWrapper"
        >


            <div
                class="heart-glow"
                id="heartGlow"
            ></div>



            <button
                class="heart-button"
                id="heartButton"
                aria-label="Recarregar coração"
            >


                <svg
                    class="heart-svg"
                    viewBox="0 0 200 200"
                    xmlns="http://www.w3.org/2000/svg"
                >


                    <defs>


                        <linearGradient
                            id="heartGradient"
                            x1="0%"
                            y1="100%"
                            x2="0%"
                            y2="0%"
                        >

                            <stop
                                offset="0%"
                                stop-color="#ff526f"
                            />

                            <stop
                                offset="100%"
                                stop-color="#ff8a9c"
                            />

                        </linearGradient>



                        <clipPath
                            id="heartClip"
                        >

                            <path
                                d="
                                M100 180
                                C90 170 20 125 20 70
                                C20 35 45 15 75 15
                                C88 15 97 21 100 35
                                C103 21 112 15 125 15
                                C155 15 180 35 180 70
                                C180 125 110 170 100 180
                                Z
                                "
                            />

                        </clipPath>

                    </defs>



                    <path
                        class="heart-base"
                        d="
                        M100 180
                        C90 170 20 125 20 70
                        C20 35 45 15 75 15
                        C88 15 97 21 100 35
                        C103 21 112 15 125 15
                        C155 15 180 35 180 70
                        C180 125 110 170 100 180
                        Z
                        "
                    />



                    <path
                        class="heart-fill"
                        id="heartFill"
                        clip-path="url(#heartClip)"
                        d="
                        M100 180
                        C90 170 20 125 20 70
                        C20 35 45 15 75 15
                        C88 15 97 21 100 35
                        C103 21 112 15 125 15
                        C155 15 180 35 180 70
                        C180 125 110 170 100 180
                        Z
                        "
                    />



                    <ellipse
                        class="heart-highlight"
                        cx="72"
                        cy="65"
                        rx="18"
                        ry="10"
                        transform="
                            rotate(-35 72 65)
                        "
                    />



                    <path
                        class="heart-outline"
                        d="
                        M100 180
                        C90 170 20 125 20 70
                        C20 35 45 15 75 15
                        C88 15 97 21 100 35
                        C103 21 112 15 125 15
                        C155 15 180 35 180 70
                        C180 125 110 170 100 180
                        Z
                        "
                    />

                </svg>


            </button>



            <div
                class="percentage"
                id="percentage"
            >
                0%
            </div>


        </div>



        <!-- =====================================================
             TEXTO
        ====================================================== -->

        <p
            class="instruction"
            id="instruction"
        >
            Clique no coração para recarregar ❤️
        </p>



        <!-- =====================================================
             BARRA
        ====================================================== -->

        <div class="progress">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>



        <!-- =====================================================
             MENSAGEM FINAL
        ====================================================== -->

        <section
            class="final-message"
            id="finalMessage"
        >

            <h2>
                Você me recarrega ❤️
            </h2>

            <button
                id="restartButton"
                type="button"
            >
                Recomeçar
            </button>

        </section>


    </main>



    <script>

        /* =========================================================
           VARIÁVEIS
        ========================================================= */

        let percentage = 0;


        const heartButton =
            document.getElementById(
                "heartButton"
            );


        const heartFill =
            document.getElementById(
                "heartFill"
            );


        const percentageText =
            document.getElementById(
                "percentage"
            );


        const counter =
            document.getElementById(
                "counter"
            );


        const instruction =
            document.getElementById(
                "instruction"
            );


        const progressFill =
            document.getElementById(
                "progressFill"
            );


        const heartWrapper =
            document.getElementById(
                "heartWrapper"
            );


        const heartGlow =
            document.getElementById(
                "heartGlow"
            );


        const game =
            document.getElementById(
                "game"
            );


        const finalMessage =
            document.getElementById(
                "finalMessage"
            );


        const restartButton =
            document.getElementById(
                "restartButton"
            );



        /* =========================================================
           FRASES
        ========================================================= */

        const messages = {

            0:
                "Clique no coração para recarregar ❤️",

            10:
                "Carregando... ❤️",

            20:
                "Carregando... ❤️",

            30:
                "Carregando... ❤️",

            40:
                "Carregando... ❤️",

            50:
                "Carregando... ❤️",

            60:
                "Carregando... ❤️",

            70:
                "Carregando... ❤️",

            80:
                "Carregando... ❤️",

            90:
                "Carregando... ❤️",

            100:
                "Bateria completamente recarregada! ❤️"

        };



        /* =========================================================
           CLIQUES
        ========================================================= */

        heartButton.addEventListener(
            "click",
            rechargeHeart
        );


        restartButton.addEventListener(
            "click",
            function () {

                location.reload();

            }
        );



        function rechargeHeart(event) {


            if (percentage >= 100) {
                return;
            }


            percentage += 10;



            percentageText.textContent =
                percentage + "%";


            counter.textContent =
                percentage +
                "% carregado";



            heartFill.style.clipPath =
                `inset(
                    ${100 - percentage}%
                    0
                    0
                    0
                )`;



            progressFill.style.width =
                percentage + "%";



            instruction.textContent =
                messages[percentage];



            heartButton.classList.remove(
                "pulse"
            );


            void heartButton.offsetWidth;


            heartButton.classList.add(
                "pulse"
            );



            heartGlow.style.transform =
                "scale(1.15)";


            heartGlow.style.opacity =
                "1";


            setTimeout(
                () => {

                    heartGlow.style.transform =
                        "scale(1)";

                    heartGlow.style.opacity =
                        "0.7";

                },
                450
            );



            createParticles();


            createFlash(event);



            if (
                percentage === 100
            ) {

                finishGame();

            }

        }



        /* =========================================================
           PARTÍCULAS
        ========================================================= */

        function createParticles() {


            const rect =
                heartWrapper.getBoundingClientRect();


            const centerX =
                rect.left +
                rect.width / 2;


            const centerY =
                rect.top +
                rect.height / 2;



            const amount =
                percentage === 100
                    ? 20
                    : 5;



            for (
                let i = 0;
                i < amount;
                i++
            ) {


                const particle =
                    document.createElement(
                        "span"
                    );


                particle.className =
                    "particle";


                particle.textContent =
                    Math.random() > 0.4
                        ? "♥"
                        : "♡";



                particle.style.left =
                    centerX + "px";


                particle.style.top =
                    centerY + "px";



                const moveX =
                    (
                        Math.random() *
                        240
                    ) - 120;


                const moveY =
                    (
                        Math.random() *
                        -220
                    ) - 40;


                const rotation =
                    (
                        Math.random() *
                        180
                    ) - 90;



                particle.style.setProperty(
                    "--move-x",
                    moveX + "px"
                );


                particle.style.setProperty(
                    "--move-y",
                    moveY + "px"
                );


                particle.style.setProperty(
                    "--rotate",
                    rotation + "deg"
                );



                document.body.appendChild(
                    particle
                );



                setTimeout(
                    () => {

                        particle.remove();

                    },
                    900
                );

            }

        }



        /* =========================================================
           FLASH
        ========================================================= */

        function createFlash(event) {

            const flash =
                document.createElement(
                    "div"
                );


            flash.className =
                "click-flash";


            let x;
            let y;



            if (
                event.clientX !== undefined
            ) {

                x = event.clientX;
                y = event.clientY;

            } else {

                const rect =
                    heartWrapper
                    .getBoundingClientRect();

                x =
                    rect.left +
                    rect.width / 2;

                y =
                    rect.top +
                    rect.height / 2;

            }



            flash.style.left =
                x + "px";


            flash.style.top =
                y + "px";



            document.body.appendChild(
                flash
            );



            setTimeout(
                () => {

                    flash.remove();

                },
                500
            );

        }



        /* =========================================================
           FINAL
        ========================================================= */

        function finishGame() {

            heartWrapper.classList.add(
                "finished"
            );


            setTimeout(
                () => {

                    instruction.style.display =
                        "none";

                    finalMessage.classList.add(
                        "show"
                    );

                },
                1000
            );


            setTimeout(
                () => {

                    createParticles();

                },
                250
            );

        }

    </script>

</body>

</html>
